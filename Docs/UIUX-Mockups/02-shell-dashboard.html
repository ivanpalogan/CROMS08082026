<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CROMS</title>
<link rel="stylesheet" href="assets/design-system.css">
<style>
  .dash-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;align-items:start;}
  @media (max-width:1180px){ .dash-grid{grid-template-columns:1fr;} }
  .task-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--row-line);}
  .task-row:last-child{border-bottom:none;}
  .task-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .task-text{flex:1;min-width:0;}
  .task-text b{font-size:12.5px;display:block;}
  .task-text span{font-size:11.5px;color:var(--faint);}
  .win-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--row-line);}
  .win-item:last-child{border-bottom:none;}
  .win-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .win-item b{font-size:12px;display:block;}
  .win-item span{font-size:11px;color:var(--faint);}
  .mini-bars{display:flex;align-items:flex-end;gap:6px;height:70px;padding-top:8px;}
  .mini-bars .bar{flex:1;background:var(--accent-tint);border-radius:3px 3px 0 0;position:relative;}
  .mini-bars .bar b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--faint);white-space:nowrap;}
  .recent-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--row-line);font-size:12px;}
  .recent-row:last-child{border-bottom:none;}
  .recent-row .who{font-weight:600;flex:1;}
  .recent-row .when{color:var(--faint);font-size:11px;}
</style>
</head>
<body>
<div id="shell-mount"></div>

<template id="page-body-template">
  <div class="content-head">
    <div>
      <h1>Good morning, Juan</h1>
      <div class="sub">Wednesday, September 16, 2026 · Window not yet claimed</div>
    </div>
    <div class="content-actions">
      <button class="btn btn-ghost btn-sm">↻ Refresh</button>
      <span class="pill pill-success"><span class="dot"></span>Live</span>
    </div>
  </div>

  <div class="kpi-row" style="margin-bottom:16px">
    <div class="kpi">
      <div class="kpi-top"><div class="kpi-ic" style="background:var(--accent-tint);color:var(--accent)">●</div><span class="pill pill-info" style="font-size:10px">Live</span></div>
      <div class="kpi-label">Waiting now</div>
      <div class="kpi-value">6</div>
      <div class="kpi-caption">2 in the priority lane</div>
    </div>
    <div class="kpi">
      <div class="kpi-top"><div class="kpi-ic" style="background:var(--success-tint);color:var(--success)">✓</div></div>
      <div class="kpi-label">Registered today</div>
      <div class="kpi-value">3</div>
      <div class="kpi-caption">2 births · 1 death</div>
    </div>
    <div class="kpi">
      <div class="kpi-top"><div class="kpi-ic" style="background:var(--warning-tint);color:var(--warning)">₱</div></div>
      <div class="kpi-label">Collections today</div>
      <div class="kpi-value"><small>₱</small>4,850<small>.00</small></div>
      <div class="kpi-caption">14 official receipts</div>
    </div>
    <div class="kpi">
      <div class="kpi-top"><div class="kpi-ic" style="background:var(--danger-tint);color:var(--danger)">!</div></div>
      <div class="kpi-label">Pending releases</div>
      <div class="kpi-value">9</div>
      <div class="kpi-caption">3 unclaimed 3+ days</div>
    </div>
  </div>

  <div class="dash-grid">
    <div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-head"><h3>Tasks requiring attention</h3><span class="hint">6 items</span></div>
        <div style="padding:6px 18px 12px">
          <div class="task-row">
            <div class="task-ic" style="background:var(--success-tint);color:var(--success)">✓</div>
            <div class="task-text"><b>3 marriage licenses ready to issue</b><span>Posting complete — no license issued yet</span></div>
            <button class="btn btn-secondary btn-sm">Review</button>
          </div>
          <div class="task-row">
            <div class="task-ic" style="background:var(--warning-tint);color:var(--warning)">⏱</div>
            <div class="task-text"><b>2 marriage licenses expiring within 7 days</b><span>120-day validity period ending soon</span></div>
            <button class="btn btn-secondary btn-sm">View list</button>
          </div>
          <div class="task-row">
            <div class="task-ic" style="background:var(--danger-tint);color:var(--danger)">✕</div>
            <div class="task-text"><b>1 application missing requirements</b><span>ML-2026-00131 — CENOMAR not yet attached</span></div>
            <button class="btn btn-secondary btn-sm">Open</button>
          </div>
          <div class="task-row">
            <div class="task-ic" style="background:var(--danger-tint);color:var(--danger)">!</div>
            <div class="task-text"><b>5 documents ready for release, 3 unclaimed 3+ days</b><span>Certificate requests awaiting claimant</span></div>
            <button class="btn btn-secondary btn-sm">Open</button>
          </div>
          <div class="task-row">
            <div class="task-ic" style="background:var(--accent-tint);color:var(--accent)">⌂</div>
            <div class="task-text"><b>4 registered marriages pending PSA transmittal</b><span>Tracked in CROMS — endorsement not yet sent</span></div>
            <button class="btn btn-secondary btn-sm">Open</button>
          </div>
          <div class="task-row">
            <div class="task-ic" style="background:var(--accent-tint);color:var(--accent)">◐</div>
            <div class="task-text"><b>1 delayed birth registration — posting day 4 of 10</b><span>Completes September 20, 2026</span></div>
            <button class="btn btn-secondary btn-sm">Open</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>Recent transactions</h3><a href="#" class="hint" style="color:var(--accent)">View all →</a></div>
        <div style="padding:4px 18px 14px">
          <div class="recent-row"><span class="pill pill-success" style="font-size:10px">Paid</span><span class="who">CTC-0231 — Certified copy of birth, M. Santos</span><span class="when">10:42 AM</span></div>
          <div class="recent-row"><span class="pill pill-info" style="font-size:10px">Posting</span><span class="who">ML-2026-00129 — new license application filed</span><span class="when">10:15 AM</span></div>
          <div class="recent-row"><span class="pill pill-success" style="font-size:10px">Released</span><span class="who">CTC-0229 — released to R. Bautista</span><span class="when">9:53 AM</span></div>
          <div class="recent-row"><span class="pill pill-neutral" style="font-size:10px">Draft</span><span class="who">Birth registration — encoded from OCR scan</span><span class="when">9:20 AM</span></div>
        </div>
      </div>
    </div>

    <div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-head"><h3>Service windows</h3></div>
        <div style="padding:6px 18px 14px">
          <div class="win-item"><div class="win-dot" style="background:var(--success)"></div><div style="flex:1"><b>Window 1 — Receiving</b><span>Serving A-023</span></div></div>
          <div class="win-item"><div class="win-dot" style="background:var(--success)"></div><div style="flex:1"><b>Window 2 — Marriage / New Reg.</b><span>Serving M-004</span></div></div>
          <div class="win-item"><div class="win-dot" style="background:var(--faint)"></div><div style="flex:1"><b>Window 3 — Cashier</b><span>Not signed in</span></div></div>
          <div class="win-item"><div class="win-dot" style="background:var(--success)"></div><div style="flex:1"><b>Window 4 — Releasing</b><span>Serving C-018</span></div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>Registrations — last 7 days</h3></div>
        <div style="padding:6px 18px 16px">
          <div class="mini-bars">
            <div class="bar" style="height:30%"><b>2</b></div>
            <div class="bar" style="height:45%"><b>3</b></div>
            <div class="bar" style="height:20%"><b>1</b></div>
            <div class="bar" style="height:60%"><b>4</b></div>
            <div class="bar" style="height:35%"><b>2</b></div>
            <div class="bar" style="height:15%"><b>1</b></div>
            <div class="bar" style="height:45%;background:var(--accent)"><b style="color:var(--accent)">3</b></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:6px">
            <span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Mon</span><span>Tue</span><span>Today</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="assets/shell.js"></script>
<script>window.CROMS_PAGE = {navKey:'dashboard', crumbs:['Dashboard'], title:'Dashboard', notifCount:6};</script>
</body>
</html>
