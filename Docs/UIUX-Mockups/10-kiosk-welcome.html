<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>CROMS Kiosk</title>
<link rel="stylesheet" href="assets/design-system.css"><link rel="stylesheet" href="assets/kiosk.css">
<style>
  .welcome-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#132441,#0D1B33);color:#fff;}
  .welcome-stage .mark{width:84px;height:84px;border-radius:22px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;margin-bottom:26px;}
  .welcome-stage h1{font-size:34px;font-weight:600;margin-bottom:10px;}
  .welcome-stage p{color:#B7C2DD;font-size:15px;max-width:420px;text-align:center;line-height:1.6;}
  .welcome-cta{margin-top:44px;background:var(--accent);color:#fff;font-size:18px;font-weight:600;padding:20px 52px;border-radius:16px;box-shadow:0 8px 24px rgba(29,78,216,.35);}
  .welcome-lang{display:flex;gap:10px;margin-top:30px;}
  .welcome-lang span{font-size:12px;color:#9AA9C6;padding:7px 14px;border:1px solid rgba(255,255,255,.18);border-radius:999px;}
</style></head>
<body class="kiosk-body">
  <div class="kiosk-topbar"><div class="mark">C</div><b>CROMS</b><span>LCRO Peñablanca · Self-service kiosk</span><div class="clock">Wed, Sep 16 · 9:41 AM</div></div>
  <a href="11-kiosk-category.html" style="text-decoration:none">
  <div class="welcome-stage">
    <div class="mark">C</div>
    <h1>Welcome to the Civil Registry Office</h1>
    <p>Touch anywhere on the screen to request a document, register an event, or track a petition.</p>
    <div class="welcome-cta">Touch to begin</div>
    <div class="welcome-lang"><span>English</span><span>Filipino</span></div>
  </div>
  </a>
</body></html>
